spring.application.name=demo

# 服务器端口
server.port=8080

# 数据库连接
spring.datasource.url=jdbc:mysql://localhost:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=lfy20021218!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
# 打印SQL日志（开发阶段打开，方便调试）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 驼峰命名转换：数据库 user_name → Java userName
mybatis-plus.configuration.map-underscore-to-camel-case=true

# 暴露所有监控端点（开发阶段方便调试）
management.endpoints.web.exposure.include=*
# 显示健康检查详情（数据库、磁盘等状态）
management.endpoint.health.show-details=always


